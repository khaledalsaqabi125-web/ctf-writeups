<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="CTF Writeups by 0xkhaled1">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1116"/>
      <stop offset="55%" stop-color="#0E1A20"/>
      <stop offset="100%" stop-color="#0A1418"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BD9A8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#2BD9A8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2BD9A8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#2BD9A8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1116" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1116" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="600" width="600" height="300" fill="url(#fade)"/>

  <!-- accent rail -->
  <rect x="0" y="0" width="4" height="300" fill="#2BD9A8"/>

  <!-- prompt line -->
  <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5D7A80">
    <tspan fill="#2BD9A8">$</tspan> cat ~/notes/ctf/*.md<tspan fill="#2BD9A8" opacity="0.85"> ▌</tspan>
  </text>

  <!-- title -->
  <text x="70" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="700" letter-spacing="2" fill="#E8F2F0">CTF WRITEUPS</text>

  <!-- underline -->
  <rect x="72" y="198" width="620" height="2" fill="url(#rule)"/>

  <!-- subtitle -->
  <text x="74" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8FA6AB">
    0xkhaled1 &#183; Kuwait &#183; <tspan fill="#2BD9A8">23</tspan> solved challenges across <tspan fill="#2BD9A8">3</tspan> competitions
  </text>

  <!-- category chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9FD8C8">
    <rect x="72"  y="258" width="62"  height="26" rx="4" fill="#132B29" stroke="#2BD9A8" stroke-opacity="0.35"/>
    <text x="87"  y="276">web</text>
    <rect x="144" y="258" width="62"  height="26" rx="4" fill="#132B29" stroke="#2BD9A8" stroke-opacity="0.35"/>
    <text x="161" y="276">pwn</text>
    <rect x="216" y="258" width="62"  height="26" rx="4" fill="#132B29" stroke="#2BD9A8" stroke-opacity="0.35"/>
    <text x="234" y="276">rev</text>
    <rect x="288" y="258" width="78"  height="26" rx="4" fill="#132B29" stroke="#2BD9A8" stroke-opacity="0.35"/>
    <text x="303" y="276">crypto</text>
    <rect x="376" y="258" width="102" height="26" rx="4" fill="#132B29" stroke="#2BD9A8" stroke-opacity="0.35"/>
    <text x="391" y="276">forensics</text>
  </g>

  <!-- flag motif, right side -->
  <g opacity="0.5">
    <text x="1128" y="262" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#2BD9A8" opacity="0.55">flag{...}</text>
  </g>
</svg>
